<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enquiry Office</title>
<meta name="theme-color" content="#163f47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Enquiry Office">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html,body{margin:0;height:100%;background:#163f47;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #wrap{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#163f47}
  iframe{width:100%;height:100%;border:0;background:#eef1f1;display:block}
  #msg{color:#fff;padding:32px;max-width:520px;margin:0 auto;line-height:1.5}
  #msg a{color:#e8c777}
  #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#163f47;color:#fff;font-size:15px;transition:opacity .4s;pointer-events:none}
  #splash img{width:84px;height:84px;border-radius:18px;display:block;margin:0 auto 14px}
</style>
</head>
<body>
<!-- ============ STEP 1: paste your web app link between the quotes below ============ -->
<script>var APP_URL = "https://script.google.com/macros/s/AKfycbw-0Qs7gJoVEpWj9g71SsbcrKnmvuKXAKQo6UU7gN4M/devPASTE_YOUR_WEB_APP_LINK_HERE";</script>
<!-- ================================================================================== -->
<div id="wrap"></div>
<div id="splash"><div style="text-align:center"><img src="icon-192.png" alt=""><div>Enquiry Office</div></div></div>
<script>
(function(){
  var wrap=document.getElementById('wrap');
  if(!/^https:\/\/script\.google\.com\//.test(APP_URL)){
    document.getElementById('splash').style.display='none';
    wrap.innerHTML='<div id="msg"><h2>Almost there</h2><p>Open <b>index.html</b> in a text editor and paste your Google Apps Script web app link (it starts with <b>https://script.google.com/</b>) in place of <b>PASTE_YOUR_WEB_APP_LINK_HERE</b>, then upload the files again.</p></div>';
    return;
  }
  var f=document.createElement('iframe');
  f.src=APP_URL; f.title='Enquiry Office'; f.allow='clipboard-write; fullscreen';
  f.onload=function(){var s=document.getElementById('splash');s.style.opacity='0';setTimeout(function(){s.style.display='none'},450)};
  wrap.appendChild(f);
  setTimeout(function(){var s=document.getElementById('splash');if(s)s.style.opacity='0.0'},9000);
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
